[package]
name = "basevn-migro"
version = "0.1.2"
edition = "2021"
authors = ["Base.vn Engineering Team"]
description = "Open-source ETL tool for migrating data to Base.vn platform"
license = "Apache-2.0"
repository = "https://github.com/basevn/basevn-migro"
rust-version = "1.75"

[[bin]]
name = "migro"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# HTTP
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Data parsing
csv = "1.3"
calamine = "0.24"  # Excel support

# Logging & Progress
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
indicatif = "0.17"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
validator = { version = "0.16", features = ["derive"] }

# Self-update - temporarily disabled for Phase 1 foundation
# self_update = "0.39"

[dev-dependencies]
mockall = "0.12"
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"
wiremock = "0.6"
tokio-test = "0.4"
